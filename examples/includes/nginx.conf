# examples/includes/nginx.conf
# Scan from the repository root:
#   nginxtrace scan --config examples/includes/nginx.conf
#   nginxtrace scan --config examples/includes/nginx.conf --no-includes

http {
    server {
        listen 80;
        server_name app.example.test;

        root /var/www/app/public;

        # Dotfile protection lives in a shared snippet.
        include snippets/deny-dotfiles.conf;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    include conf.d/*.conf;
}
