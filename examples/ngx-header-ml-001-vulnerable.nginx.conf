# examples/ngx-header-ml-001-vulnerable.nginx.conf

server {
    listen 80;
    server_name multiline-header-vulnerable.example.test;

    add_header Content-Security-Policy "default-src 'self';
script-src 'self' https://cdn.example.test" always;

    location / {
        try_files $uri $uri/ =404;
    }
}