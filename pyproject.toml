[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nginxtrace"
version = "0.1.0"
description = "CLI scanner for NGINX configuration."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
nginxtrace = "nginxtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]